name = "PBCatcher"
version = "0.6.0"
defaultTargets = ["PBCatcher"]

[[lean_lib]]
name = "PBCatcherKernel"

[[lean_lib]]
name = "PBCatcher"

# Precompiled checker: exposes the closed module set of the reflection
# checker as native code so checkProofBool runs compiled (like bv_decide)
# instead of interpreted. Declared LAST: Lake resolves module ownership
# with findSomeRev? (last lib wins), and this lib must own these six
# modules (Dominance because ReflectCheck imports it); otherwise the PBCatcher
# lib claims them via its root-name prefix and precompilation causes build
# cycles through PBCatcher:shared.
[[lean_lib]]
name = "PBCatcherReflect"
roots = ["PBCatcher.Reflect"]
globs = [
  "PBCatcher.PseudoBoolean",
  "PBCatcher.Dominance",
  "PBCatcher.FromVeriPB",
  "PBCatcher.ReflectCheck",
  "PBCatcher.ReflectFast",
  "PBCatcher.Reflect",
]
precompileModules = true
